name: macOS Free Cloud Session

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Tmate Terminal
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true

      - name: Keep Runner Alive
        run: |
          echo "macOS live session is active..."
          sleep 21600
