name: macOS Free VNC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup VNC Screen Sharing
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          # VNC enable aur runner password set karna
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "$VNC_PASSWORD" \
            -restart -agent -privs -all

      - name: Install & Start Ngrok
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          # Fast direct download (brew se fast aur clean hai)
          curl -s https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-darwin-arm64.zip -o ngrok.zip
          unzip -q ngrok.zip
          sudo mv ngrok /usr/local/bin/

          # Configure token
          ngrok config add-authtoken "$NGROK_AUTH_TOKEN"

          # Start ngrok in background
          nohup ngrok tcp 5900 --log=stdout > ngrok.log 2>&1 &
          
          # Wait until tunnel is established
          echo "Waiting for Ngrok tunnel..."
          for i in {1..30}; do
            URL=$(curl -s http://127.0.0.1:4040/api/tunnels | grep -o 'tcp://[^"]*' || true)
            if [ -n "$URL" ]; then
              echo "===================================================="
              echo "SUCCESS! CONNECT TO THIS ADDRESS IN VNC VIEWER:"
              echo "$URL"
              echo "===================================================="
              break
            fi
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "Ngrok failed to start. Printing log:"
            cat ngrok.log
            exit 1
          fi

      - name: Keep Runner Alive
        run: |
          echo "macOS session active. Running for up to 6 hours..."
          sleep 21600
